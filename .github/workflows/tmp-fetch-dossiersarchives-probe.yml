name: Temporary secure probe return

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-fetch-dossiersarchives-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Consume one-time PHP probe
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.nephesh.ch/T-GPT/T-AI/__gpt_da_probe_4a64d01667d34ce4975fb6a1.php"
          HTTP=$(curl -sS --max-time 30 -o /tmp/da.json -w '%{http_code}' "$URL")
          test "$HTTP" = "200"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/da.json',encoding='utf-8'))
          assert d.get('ok') is True, d.get('error')
          assert isinstance(d.get('entries'), list)
          print('Probe consumed and validated; contents withheld from logs.')
          PY

      - name: Encrypt result for GPT
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pub.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0sS+jXrbyiXvEVwustjT
          3b+u37lq0t9NVYnLLKojHfIoFbPhmOP+YXYQTRSWxz/XfSXLjyrIn8recLhlcB9z
          Pb//cKtEJCxIxFSIhRYQv5PGggIHIT6OcsscbJ7FOu8Wx0SehlwvVCKCziDvxXrJ
          QpcO18DuQv8MQ2szemcbRja7sPhFTQepLY2DIObwg8bQkjiuo/rLxfsI6vfpsO5E
          JARJjJleu49WoCz0c2RSuZFxPf2KoiBSTu95k9bD6DoL2Zq4hcidJPM3ZJS2LSfJ
          ZeQILK+8W0UatJKWoh0t5vfZ9PZU6byN0T2NjzQHpjkv+qtm+O/Y9QKaMgSbeS6j
          OQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          KEY_HEX=$(openssl rand -hex 32)
          IV_HEX=$(openssl rand -hex 16)
          printf '%s' "$KEY_HEX" | xxd -r -p > /tmp/key.bin
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in /tmp/da.json -out /tmp/da.bin
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in /tmp/key.bin -out /tmp/key.rsa \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          mkdir -p tmp
          python3 - "$IV_HEX" <<'PY'
          import base64,json,sys
          obj={
            'schema':'GPT_SECURE_RETURN_V1',
            'cipher':'AES-256-CBC',
            'key_wrap':'RSA-OAEP-SHA256',
            'iv_hex':sys.argv[1],
            'encrypted_key_b64':base64.b64encode(open('/tmp/key.rsa','rb').read()).decode(),
            'ciphertext_b64':base64.b64encode(open('/tmp/da.bin','rb').read()).decode(),
          }
          json.dump(obj,open('tmp/dossiersarchives-secure-return.json','w',encoding='utf-8'),separators=(',',':'))
          PY

      - name: Commit encrypted return
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add tmp/dossiersarchives-secure-return.json
          git commit -m "Record encrypted DossiersArchives return [skip ci]"
          git push origin HEAD:main
