name: Publish T-LAB to Infomaniak

on:
  push:
    branches:
      - main
    paths:
      - "t-lab-publish/site/**"
      - ".github/workflows/deploy-tlab-infomaniak.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infomaniak-tlab-production
  cancel-in-progress: false

jobs:
  deploy:
    name: FTPS deploy to isolated T-LAB
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ngw.ftp.infomaniak.com
      FTP_USER: ngw_T-LAB-PUBLISH
      FTP_PASSWORD: ${{ secrets.INFOMANIAK_TLAB_FTP_PASSWORD }}
      REMOTE_DIR: /
      FTP_JAILED_ROOT: "true"
      LOCAL_DIR: t-lab-publish/site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate isolated deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" || { echo "Missing FTP host"; exit 1; }
          test -n "$FTP_USER" || { echo "Missing FTP user"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing INFOMANIAK_TLAB_FTP_PASSWORD repository secret"; exit 1; }
          test -d "$LOCAL_DIR" || { echo "Missing local T-LAB publish directory"; exit 1; }
          test -f "$LOCAL_DIR/index.html" || { echo "Missing T-LAB index.html"; exit 1; }
          test "$FTP_JAILED_ROOT" = "true" || { echo "Refusing FTP root deployment without jailed account declaration"; exit 1; }
          test "$FTP_USER" = "ngw_T-LAB-PUBLISH" || { echo "Refusing unexpected FTP user"; exit 1; }
          test "$LOCAL_DIR" = "t-lab-publish/site" || { echo "Refusing unexpected local directory"; exit 1; }

      - name: Install FTPS client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Publish over explicit FTPS
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          open -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
          mirror --reverse --verbose --parallel=4 "$LOCAL_DIR" "$REMOTE_DIR"
          bye
          EOF

      - name: Verify deployed file through isolated FTPS account
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/tlab-index.html
          lftp <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          open -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
          get /index.html -o /tmp/tlab-index.html
          bye
          EOF
          test -s /tmp/tlab-index.html
          grep -q '<title>T-LAB</title>' /tmp/tlab-index.html
          echo "T-LAB FTPS verification OK"

      - name: Deployment summary
        shell: bash
        run: |
          echo "T-LAB publication completed."
          echo "FTP account: $FTP_USER"
          echo "Source: $LOCAL_DIR"
          echo "Remote root: isolated /web/T-LAB"
