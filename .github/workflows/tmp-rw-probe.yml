name: Temporary T-LAB RW probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/tmp-rw-probe.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Execute self-cleaning RW probe
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "https://www.nephesh.ch/T-GPT/T-AI/__gpt_rw_probe_20260901.php" -o /tmp/rw.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/rw.json'))
          assert d.get('ok') is True, d
          assert d.get('wrote') is True, d
          assert d.get('verified') is True, d
          assert d.get('cleaned') is True, d
          print('T-LAB RW probe: write + readback + cleanup = OK')
          PY
