name: Secure read T-LAB archives v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/secure-read-tlab-archives-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FTP_HOST: ngw.ftp.infomaniak.com
  FTP_USER: ngw_GPT-PUBLISH
  FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}

jobs:
  read-archives:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and encrypt T-LAB archive files
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_PASSWORD"
          mkdir -p /tmp/tlab-secure
          python3 - <<'PY'
          import os, ssl, json, secrets, ftplib, urllib.request, urllib.parse, urllib.error, pathlib, tarfile, subprocess, sys, time
          from io import BytesIO

          host=os.environ['FTP_HOST']; user=os.environ['FTP_USER']; password=os.environ['FTP_PASSWORD']
          token=secrets.token_hex(32)
          probe=f"archive-bridge-{os.environ.get('GITHUB_RUN_ID','run')}-{secrets.token_hex(6)}.php"
          remote='/T-AI/' + probe
          base_url='https://www.nephesh.ch/T-GPT/T-AI/' + urllib.parse.quote(probe)
          work=pathlib.Path('/tmp/tlab-secure')
          bundle=work/'bundle'; bundle.mkdir(parents=True, exist_ok=True)
          cert=pathlib.Path('infomaniak-publish/tlab-session-public.crt')

          php = r'''<?php
          @ini_set('display_errors','0');
          header('X-Robots-Tag: noindex, nofollow, noarchive');
          header('Cache-Control: no-store, max-age=0');
          $expected='__TOKEN__';
          $provided=isset($_GET['token']) ? (string)$_GET['token'] : '';
          if (!hash_equals($expected,$provided)) { http_response_code(404); exit; }
          $root=rtrim((string)$_SERVER['DOCUMENT_ROOT'],'/') . '/T-LAB/DossiersArchives';
          $realRoot=realpath($root);
          if ($realRoot===false || !is_dir($realRoot) || !is_readable($realRoot)) {
            header('Content-Type: application/json; charset=utf-8');
            http_response_code(500);
            echo json_encode(['ok'=>false,'error'=>'ARCHIVE_ROOT_UNREADABLE']); exit;
          }
          $mode=isset($_GET['mode']) ? (string)$_GET['mode'] : 'list';
          if ($mode==='list') {
            $items=[];
            $it=new RecursiveIteratorIterator(new RecursiveDirectoryIterator($realRoot, FilesystemIterator::SKIP_DOTS), RecursiveIteratorIterator::SELF_FIRST);
            foreach ($it as $f) {
              $p=$f->getPathname(); $rel=ltrim(substr($p,strlen($realRoot)),'/');
              if ($rel==='') continue;
              $items[]=['path'=>$rel,'type'=>$f->isDir()?'dir':'file','size'=>$f->isFile()?$f->getSize():null,'mtime'=>$f->getMTime()];
            }
            header('Content-Type: application/json; charset=utf-8');
            echo json_encode(['ok'=>true,'items'=>$items], JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE); exit;
          }
          if ($mode==='get') {
            $rel=isset($_GET['path']) ? (string)$_GET['path'] : '';
            if ($rel==='' || strpos($rel,"\0")!==false) { http_response_code(400); exit; }
            $candidate=realpath($realRoot . '/' . $rel);
            if ($candidate===false || !is_file($candidate) || !is_readable($candidate)) { http_response_code(404); exit; }
            $prefix=rtrim($realRoot,DIRECTORY_SEPARATOR).DIRECTORY_SEPARATOR;
            if (strncmp($candidate,$prefix,strlen($prefix))!==0) { http_response_code(403); exit; }
            header('Content-Type: application/octet-stream');
            header('Content-Length: '.filesize($candidate));
            readfile($candidate); exit;
          }
          http_response_code(400);
          ?>'''.replace('__TOKEN__', token)

          headers={
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept':'application/json,text/plain,*/*',
              'Referer':'https://www.nephesh.ch/T-GPT/T-AI/'
          }
          ctx=ssl.create_default_context()
          ftp=None
          try:
              ftp=ftplib.FTP_TLS(timeout=25)
              ftp.connect(host,21); ftp.login(user,password); ftp.prot_p()
              ftp.storbinary('STOR '+remote, BytesIO(php.encode('utf-8')))
              time.sleep(2)
              list_url=base_url+'?'+urllib.parse.urlencode({'token':token,'mode':'list'})
              req=urllib.request.Request(list_url,headers=headers)
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=30) as r:
                      inv=json.loads(r.read().decode('utf-8'))
              except urllib.error.HTTPError as e:
                  print(f'Archive bridge HTTP status: {e.code}', file=sys.stderr)
                  raise
              if not inv.get('ok'):
                  raise RuntimeError('archive inventory unavailable')
              files=[x for x in inv.get('items',[]) if x.get('type')=='file']
              total=0; manifest=[]; root_local=bundle.resolve()
              for row in files:
                  rel=str(row.get('path',''))
                  pure=pathlib.PurePosixPath(rel); parts=pure.parts
                  if not rel or pure.is_absolute() or any(p in ('','..') for p in parts):
                      raise RuntimeError('unsafe relative path')
                  dest=bundle.joinpath(*parts); dest.parent.mkdir(parents=True,exist_ok=True)
                  parent=dest.parent.resolve()
                  if parent!=root_local and root_local not in parent.parents:
                      raise RuntimeError('unsafe local destination')
                  get_url=base_url+'?'+urllib.parse.urlencode({'token':token,'mode':'get','path':rel})
                  req=urllib.request.Request(get_url,headers={**headers,'Accept':'application/octet-stream'})
                  with urllib.request.urlopen(req,context=ctx,timeout=120) as r, open(dest,'wb') as f:
                      while True:
                          chunk=r.read(1024*1024)
                          if not chunk: break
                          f.write(chunk); total+=len(chunk)
                  manifest.append({'path':rel,'size':dest.stat().st_size,'mtime':row.get('mtime')})
              with open(bundle/'_manifest.json','w',encoding='utf-8') as f:
                  json.dump({'file_count':len(manifest),'total_bytes':total,'files':manifest},f,ensure_ascii=False,indent=2)
              archive=work/'TLAB_DossiersArchives.tar.gz'
              with tarfile.open(archive,'w:gz') as tf: tf.add(bundle,arcname='DossiersArchives')
              encrypted=work/'TLAB_DossiersArchives.p7m'
              subprocess.run(['openssl','cms','-encrypt','-binary','-aes-256-cbc','-in',str(archive),'-outform','DER','-out',str(encrypted),str(cert)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              archive.unlink(missing_ok=True)
              print(f'Secure archive prepared: {len(manifest)} file(s), {total} byte(s).')
          except Exception:
              print('Secure archive read failed before plaintext export.',file=sys.stderr)
              raise
          finally:
              if ftp is not None:
                  try: ftp.delete(remote)
                  except Exception: pass
                  try: ftp.quit()
                  except Exception: pass
          PY

      - name: Upload encrypted archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: tlab-dossiersarchives-encrypted-v2
          path: /tmp/tlab-secure/TLAB_DossiersArchives.p7m
          if-no-files-found: error
          retention-days: 1
