name: Publish to Infomaniak

on:
  push:
    branches:
      - main
    paths:
      - "infomaniak-publish/site/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: infomaniak-production
  cancel-in-progress: false

jobs:
  deploy:
    name: FTPS deploy to isolated T-GPT
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ngw.ftp.infomaniak.com
      FTP_USER: ngw_GPT-PUBLISH
      FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      REMOTE_DIR: /
      FTP_JAILED_ROOT: "true"
      LOCAL_DIR: infomaniak-publish/site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate isolated deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST" || { echo "Missing FTP host"; exit 1; }
          test -n "$FTP_USER" || { echo "Missing FTP user"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing INFOMANIAK_FTP_PASSWORD repository secret"; exit 1; }
          test -d "$LOCAL_DIR" || { echo "Missing local publish directory"; exit 1; }

          if [ "$REMOTE_DIR" = "/" ] || [ "$REMOTE_DIR" = "." ]; then
            test "$FTP_JAILED_ROOT" = "true" || {
              echo "Refusing FTP root deployment: account is not declared isolated."
              exit 1
            }
          fi

          test "$FTP_USER" = "ngw_GPT-PUBLISH" || {
            echo "Refusing unexpected FTP user."
            exit 1
          }

      - name: Install FTPS client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Publish over explicit FTPS
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          open -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
          mirror --reverse --verbose --parallel=4 "$LOCAL_DIR" "$REMOTE_DIR"
          bye
          EOF

      - name: Deployment summary
        shell: bash
        run: |
          echo "Infomaniak publication completed."
          echo "FTP account: $FTP_USER"
          echo "Source: $LOCAL_DIR"
          echo "Remote root: isolated /web/T-GPT"

      - name: Record deployment status
        if: always()
        shell: bash
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p infomaniak-publish/status
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > infomaniak-publish/status/latest.json <<EOF
          {
            "status": "$DEPLOY_STATUS",
            "timestamp_utc": "$NOW",
            "source_commit": "$GITHUB_SHA",
            "run_id": "$GITHUB_RUN_ID",
            "target": "/web/T-GPT",
            "ftp_user": "ngw_GPT-PUBLISH"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infomaniak-publish/status/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Infomaniak deploy status [skip ci]"
            git push origin HEAD:main
          fi
