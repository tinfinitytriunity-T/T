name: Publish to Infomaniak

on:
  push:
    branches:
      - main
    paths:
      - "infomaniak-publish/site/**"
      - ".github/workflows/deploy-infomaniak.yml"
  workflow_dispatch:

# Public-primary rail: the GitHub token is deliberately read-only.
# Infomaniak authentication is provided only to the deployment job through
# the repository secret and is never written to the repository.
permissions:
  contents: read

concurrency:
  group: infomaniak-production
  cancel-in-progress: false

jobs:
  deploy:
    name: FTPS deploy to isolated T-GPT
    if: github.repository == 'tinfinitytriunity-T/T' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ngw.ftp.infomaniak.com
      FTP_USER: ngw_GPT-PUBLISH
      FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
      REMOTE_DIR: /
      FTP_JAILED_ROOT: "true"
      LOCAL_DIR: infomaniak-publish/site

    steps:
      - name: Checkout pinned source
        # actions/checkout commit observed on the validated 2026-09-01 runner.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate isolated deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tinfinitytriunity-T/T"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$FTP_HOST" || { echo "Missing FTP host"; exit 1; }
          test -n "$FTP_USER" || { echo "Missing FTP user"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing INFOMANIAK_FTP_PASSWORD repository secret"; exit 1; }
          test -d "$LOCAL_DIR" || { echo "Missing local publish directory"; exit 1; }

          if [ "$REMOTE_DIR" = "/" ] || [ "$REMOTE_DIR" = "." ]; then
            test "$FTP_JAILED_ROOT" = "true" || {
              echo "Refusing FTP root deployment: account is not declared isolated."
              exit 1
            }
          fi

          test "$FTP_USER" = "ngw_GPT-PUBLISH" || {
            echo "Refusing unexpected FTP user."
            exit 1
          }

          # Never deploy symlinks from the public repository.
          if find "$LOCAL_DIR" -type l -print -quit | grep -q .; then
            echo "Refusing deployment containing symlinks."
            exit 1
          fi

      - name: Install FTPS client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Publish over explicit FTPS
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          open -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST"
          mirror --reverse --verbose --parallel=4 "$LOCAL_DIR" "$REMOTE_DIR"
          bye
          EOF

      - name: T^AI Nephesh smoke test
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://www.nephesh.ch/T-GPT/T-AI"
          sleep 2
          curl -fsS --max-time 20 "$BASE/api/health.php" -o /tmp/tai-health.json
          curl -fsS --max-time 20 "$BASE/api/models.php" -o /tmp/tai-models.json
          curl -fsS --max-time 20 "$BASE/api/status.php" -o /tmp/tai-status.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/tai-health.json'))
          m=json.load(open('/tmp/tai-models.json'))
          s=json.load(open('/tmp/tai-status.json'))
          ports=m.get('portances') or []
          step=next((p for p in ports if p.get('id')=='step_37'), None)
          assert h.get('status')=='ok', h
          assert len(ports) >= 3, ports
          assert step is not None, ports
          assert step.get('inference_ready') is True, step
          assert (s.get('field') or {}).get('ready_count',0) >= 3, s
          assert s.get('winner') is None and s.get('vote') is None and s.get('global_score') is None, s
          print('T^AI smoke: 3+ ready portances; Step 3.7 registered and ready')
          PY

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Infomaniak deployment"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Ref: $GITHUB_REF"
            echo "- FTP account: $FTP_USER"
            echo "- Source: $LOCAL_DIR"
            echo "- Remote root: isolated /web/T-GPT"
            echo "- GitHub token permissions: contents=read"
            echo "- Checkout credentials persisted: false"
          } >> "$GITHUB_STEP_SUMMARY"
