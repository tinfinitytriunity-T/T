<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <title>T-LAB</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#07080a;
      --panel:#0d0f13;
      --line:#22262d;
      --text:#f4f5f7;
      --muted:#8e96a3;
      --accent:#dfe7f7;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
    header,main,footer{width:min(1120px,calc(100% - 40px));margin-inline:auto}
    header{height:84px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:650;letter-spacing:.08em}
    .mark{width:9px;height:9px;border:1px solid var(--accent);transform:rotate(45deg)}
    .private{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 10px}
    main{padding:76px 0 90px}
    h1{margin:0;font-size:clamp(44px,8vw,92px);font-weight:600;line-height:.92;letter-spacing:-.055em}
    .rule{margin:48px 0 28px;border:0;border-top:1px solid var(--line)}
    .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:18px}
    h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .count{font-size:12px;color:var(--muted)}
    .empty{min-height:170px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.015),rgba(255,255,255,0));display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
    footer{height:68px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:.06em}
    @media(max-width:620px){header,main,footer{width:min(100% - 28px,1120px)}header{height:72px}main{padding:54px 0 70px}.rule{margin-top:38px}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>T-LAB</span></div>
    <div class="private">Privé</div>
  </header>

  <main>
    <h1>T-LAB</h1>
    <hr class="rule">
    <div class="section-head">
      <h2>Pages</h2>
      <span class="count">0</span>
    </div>
    <div class="empty">Aucune page publiée</div>
  </main>

  <footer>
    <span>nephesh.ch/T-LAB</span>
    <span>PRIVATE</span>
  </footer>
</body>
</html>
