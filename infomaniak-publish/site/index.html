<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T-GPT — Test de publication</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d10;color:#f5f7fa;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(760px,calc(100% - 32px));padding:48px;border:1px solid #2b3138;border-radius:24px;background:#12161b;box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:#8d98a5}
    h1{font-size:clamp(2.2rem,7vw,4.6rem);line-height:.95;margin:.5rem 0 1.2rem}
    p{font-size:1.05rem;line-height:1.7;color:#c8d0d8}
    code{padding:.2em .45em;border-radius:.45em;background:#1d232a;color:#fff}
    .ok{display:inline-flex;gap:.6rem;align-items:center;margin-top:1.2rem;padding:.75rem 1rem;border:1px solid #37404a;border-radius:999px;color:#e9eef3}
    .dot{width:.65rem;height:.65rem;border-radius:50%;background:#80e6a6;box-shadow:0 0 18px #80e6a6}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Nephesh · T-GPT</div>
    <h1>Connexion établie.</h1>
    <p>Cette page a été créée dans ChatGPT, enregistrée dans GitHub, puis publiée automatiquement vers l’hébergement Infomaniak isolé dans <code>/web/T-GPT</code>.</p>
    <div class="ok"><span class="dot"></span> Canal GPT → GitHub → Infomaniak</div>
  </main>
</body>
</html>
